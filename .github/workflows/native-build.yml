name: Native build

# Reusable native desktop build matrix (macOS + Windows), called by both the PR
# CI workflow (debug build — compile/link validation) and the Release workflow
# (release build + packaged artifacts). Defining the matrix and runner pins in
# ONE place keeps PR validation and the release build from drifting apart — the
# drift that let a Windows-only break reach main undetected.

on:
  workflow_call:
    inputs:
      release:
        description: "Build optimized binaries and upload packaged artifacts"
        type: boolean
        default: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # report every platform; don't let one cancel the others
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: floraforge-macos-aarch64
          - name: Windows
            # Pinned to windows-2022 for a deterministic MSVC toolchain (avoids
            # the in-flight windows-latest -> windows-2025 image migration). NB:
            # the linker break that motivated this gate was actually a hardcoded
            # absolute link.exe path in .cargo/config.toml, not the image.
            os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: floraforge-windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Debug build on PRs (faster, still links the binary so linker/cfg/platform
      # errors surface); optimized build for releases.
      - name: Build executable
        run: cargo build ${{ inputs.release && '--release' || '' }} --target ${{ matrix.target }} --bin world-gen

      - name: Package (macOS)
        if: ${{ inputs.release && runner.os == 'macOS' }}
        run: |
          mkdir staging
          cp target/${{ matrix.target }}/release/world-gen staging/floraforge
          cd staging && zip -r ../${{ matrix.artifact }}.zip .

      # Windows ships as a bare .exe (no zip): it's a single self-contained
      # binary, so zipping only adds an extra unpack step for the user.
      - name: Package (Windows)
        if: ${{ inputs.release && runner.os == 'Windows' }}
        shell: pwsh
        run: Copy-Item "target/${{ matrix.target }}/release/world-gen.exe" "${{ matrix.artifact }}.exe"

      - name: Upload artifact (zip)
        if: ${{ inputs.release && runner.os != 'Windows' }}
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

      - name: Upload artifact (exe)
        if: ${{ inputs.release && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.exe
