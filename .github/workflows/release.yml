name: Release

on:
  push:
    branches: [production]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build wasm (release)
        run: cargo build --release --target wasm32-unknown-unknown --lib

      # Version must match wasm-bindgen crate version in Cargo.lock (currently 0.2.114)
      - name: Download wasm-bindgen-cli
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BINDGEN_VERSION="0.2.114"
          ASSET="wasm-bindgen-${BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          gh release download "${BINDGEN_VERSION}" --repo wasm-bindgen/wasm-bindgen --pattern "${ASSET}"
          tar xzf "${ASSET}"
          mv "wasm-bindgen-${BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/
          wasm-bindgen --version

      - name: Generate JS glue with wasm-bindgen
        run: |
          wasm-bindgen \
            --target web \
            --out-dir web/pkg \
            --out-name world_gen \
            target/wasm32-unknown-unknown/release/world_gen.wasm

      - name: Generate version tag
        id: version
        run: echo "tag=v$(date +%Y%m%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create release zip
        run: cd web && zip -r ../floraforge-web.zip .

      - name: Upload zip artifact
        uses: actions/upload-artifact@v5
        with:
          name: floraforge-web-zip
          path: floraforge-web.zip

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

    outputs:
      tag: ${{ steps.version.outputs.tag }}

  # Same matrix the PR CI validates (native-build.yml), here with release=true to
  # produce optimized, packaged binaries. Single source of truth → no drift.
  build-native:
    name: Build native
    uses: ./.github/workflows/native-build.yml
    with:
      release: true

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [build-wasm, build-native]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Create GitHub Release
    needs: [build-wasm, build-native]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.build-wasm.outputs.tag }}" \
            --generate-notes \
            --title "${{ needs.build-wasm.outputs.tag }}" \
            artifacts/floraforge-web-zip/floraforge-web.zip \
            artifacts/floraforge-macos-aarch64/floraforge-macos-aarch64.zip \
            artifacts/floraforge-windows-x86_64/floraforge-windows-x86_64.zip
