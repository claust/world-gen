name: Release

on:
  push:
    branches: [production]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Compute the release tag once, up front, so every downstream job agrees on it.
  # The native build needs it *before compiling* to bake the per-tag world_base.bin
  # download URL into the binary, and the release publishes the asset at exactly
  # that URL — a release asset's URL is fully determined by repo + tag + filename,
  # so it's known before the asset exists.
  version:
    name: Compute version tag
    runs-on: ubuntu-latest
    steps:
      - name: Generate version tag
        id: version
        run: echo "tag=v$(date +%Y%m%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
    outputs:
      tag: ${{ steps.version.outputs.tag }}

  # Generate the prebuilt base worlds on a cheap Linux runner and upload them as
  # artifacts. Native and web need separate snapshots because the web build uses
  # a coarser default river grid; `GameConfig` feeds the generation key, so a
  # native snapshot is correctly rejected by wasm.
  generate-base:
    name: Generate base world
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: generate-base

      # The audio backend (rodio → cpal → alsa-sys) links against ALSA on Linux,
      # discovered via pkg-config. ubuntu-latest doesn't ship the dev headers, so
      # the generator build below would fail to link without this.
      - name: Install system audio libraries (ALSA)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build generator
        run: cargo build --release --bin FloraForge

      - name: Generate world_base.bin
        run: |
          # Match a fresh end-user install: with no herbarium.json / config.json in
          # the working directory the generator uses the default (default_seeded)
          # herbarium and default config for each target profile — the same ones a
          # first-time client loads and validates the download against. Both are
          # gitignored runtime artifacts (not in the checkout); this rm is a guard
          # against a stray copy producing a generation key no shipped client would
          # match.
          rm -f herbarium.json config.json
          mkdir -p native web
          ./target/release/FloraForge --generate-base native/world_base.bin
          ./target/release/FloraForge --generate-base-web web/world_base.bin

      - name: Upload world-base artifact
        uses: actions/upload-artifact@v6
        with:
          name: floraforge-world-base
          path: native/world_base.bin

      - name: Upload web world-base artifact
        uses: actions/upload-artifact@v5
        with:
          name: floraforge-web-world-base
          path: web/world_base.bin

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    # The prebuilt base world is bundled into the web deploy so the wasm client
    # can fetch it same-origin (a browser can't read the cross-origin release
    # asset — GitHub's asset hosts send no CORS headers). This artifact is the
    # web-profile snapshot, not the native release asset.
    needs: generate-base

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build wasm (release)
        run: cargo build --release --target wasm32-unknown-unknown --lib

      # Version must match wasm-bindgen crate version in Cargo.lock (currently 0.2.114)
      - name: Download wasm-bindgen-cli
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BINDGEN_VERSION="0.2.114"
          ASSET="wasm-bindgen-${BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          gh release download "${BINDGEN_VERSION}" --repo wasm-bindgen/wasm-bindgen --pattern "${ASSET}"
          tar xzf "${ASSET}"
          mv "wasm-bindgen-${BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/
          wasm-bindgen --version

      - name: Generate JS glue with wasm-bindgen
        run: |
          wasm-bindgen \
            --target web \
            --out-dir web/pkg \
            --out-name world_gen \
            target/wasm32-unknown-unknown/release/world_gen.wasm

      # Place the prebuilt snapshot next to the bundle so the wasm client fetches
      # it at the same-origin path `world_base.bin` instead of generating locally.
      - name: Bundle prebuilt base world
        uses: actions/download-artifact@v7
        with:
          name: floraforge-web-world-base
          path: web/

      - name: Create release zip
        run: cd web && zip -r ../floraforge-web.zip .

      - name: Upload zip artifact
        uses: actions/upload-artifact@v6
        with:
          name: floraforge-web-zip
          path: floraforge-web.zip

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

  # Same matrix the PR CI validates (native-build.yml), here with release=true to
  # produce optimized, packaged binaries. Single source of truth → no drift.
  build-native:
    name: Build native
    needs: version
    uses: ./.github/workflows/native-build.yml
    with:
      release: true
      # Pinned, per-tag release-asset URL. Deterministic from repo + tag, so it's
      # safe to bake into the binary now even though the asset is uploaded later
      # in this same run (see the `version` and `release` jobs).
      world_base_url: https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/world_base.bin

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [build-wasm, build-native]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Create GitHub Release
    needs: [version, build-wasm, build-native, generate-base]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # world_base.bin is published here at exactly the URL baked into the
          # native binaries (see build-native), so first-time players download it.
          gh release create "${{ needs.version.outputs.tag }}" \
            --generate-notes \
            --title "${{ needs.version.outputs.tag }}" \
            artifacts/floraforge-web-zip/floraforge-web.zip \
            artifacts/floraforge-macos-aarch64/floraforge-macos-aarch64.zip \
            artifacts/floraforge-windows-x86_64/floraforge-windows-x86_64.exe \
            artifacts/floraforge-world-base/world_base.bin
