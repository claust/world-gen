[package]
name = "world-gen"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# The binary is named `FloraForge` (not the package name `world-gen`) so that an
# un-bundled `cargo run` presents as "FloraForge" in the macOS dock/menu bar — the
# OS derives an un-bundled app's display name from the executable's file name.
[[bin]]
name = "FloraForge"
path = "src/main.rs"

# Fast debug builds (e.g. VS Code F5 → target/debug). World generation is
# dominated by 4D simplex sampling, and since terrain noise moved into our
# own crate (`world_core::noise4`; the `noise` dependency remains only as the
# benchmark baseline in examples) the dev opt-level below — not the
# dependency override — is what keeps it usable: at opt-level 0 full-world
# gen took ~24 min. Fully optimize dependencies (rarely stepped through)
# while keeping our own crate lightly optimized so it stays debuggable and
# quick to rebuild incrementally.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dependencies]
anyhow = "1.0"
# Pure-Rust Brotli (no C deps, builds on wasm) — compresses the base-world
# snapshot (`world_base.bin`). See `world_runtime::plant_world` base codec.
brotli = "8"
bytemuck = { version = "1.16", features = ["derive"] }
egui = "0.33"
# PNG decoding (start-menu logo on every target; thumbnails/screenshots on
# native). Pure-Rust `png` backend builds on wasm, so keep it in the shared
# table rather than the non-wasm block.
image = { version = "0.25", default-features = false, features = ["png"] }
gltf = "1"
glam = "0.29"
fast-surface-nets = "0.2"
log = "0.4"
noise = "0.9"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wgpu = "27"
winit = "0.29"
egui-wgpu = { version = "0.33", default-features = false }

# Dev-only: the MSDF font-atlas baker (`examples/bake_hud_font.rs`). These pull in
# nalgebra etc. but compile ONLY for the example — the shipped game/wasm binary
# loads the pre-baked `assets/fonts/hud_atlas.*` and never depends on them.
[dev-dependencies]
fdsm = "0.8"
fdsm-ttf-parser = "0.2"
ttf-parser = "0.25"
nalgebra = "0.34"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Audio output. We synthesize ambient beds in-memory and feed them as raw f32
# sample buffers, so none of rodio's file-decoding features are needed.
rodio = { version = "0.20", default-features = false }
# System clipboard access for copying screenshots (the `P` shortcut). We only
# push raw RGBA image data, so we drop the default text/Wayland features and
# keep image-data.
arboard = { version = "3", default-features = false, features = ["image-data"] }
axum = { version = "0.7", features = ["ws"] }
notify = "7"
env_logger = "0.11"
futures-util = "0.3"
pollster = "0.3"
rayon = "1.10"
tokio = { version = "1.38", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
ureq = "2"
tower-http = { version = "0.6", features = ["cors"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
console_error_panic_hook = "0.1"
console_log = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlCanvasElement",
    "Storage",
    "Request",
    "Response",
] }
web-time = "1"
